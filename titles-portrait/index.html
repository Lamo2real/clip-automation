<!doctype html>
<html
  lang="en"
  data-resolution="portrait"
  data-composition-variables='[
    {"id":"title","type":"string","label":"Title","description":"Main headline of the card","default":"Your Video Title"},
    {"id":"subtitle","type":"string","label":"Subtitle","description":"Smaller line under the headline","default":"A short subtitle"},
    {"id":"accent","type":"color","label":"Accent color","default":"#ff5a36"},
    {"id":"ground","type":"color","label":"Background color","default":"#0e0e10"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --ground: #0e0e10;
        --ink: #ffffff;
        --accent: #ff5a36;
        --font-display: "Inter", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        font-family: var(--font-display);
        background: var(--ground);
      }
      #card {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        padding: 0 96px;
      }
      #bar {
        width: 160px;
        height: 12px;
        background: var(--accent);
        margin-bottom: 48px;
        transform-origin: left center;
      }
      #title {
        color: var(--ink);
        font-size: 112px;
        font-weight: 800;
        letter-spacing: -0.04em;
        line-height: 1.05;
      }
      #subtitle {
        color: var(--ink);
        opacity: 0.7;
        font-size: 44px;
        font-weight: 500;
        margin-top: 32px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="4"
      data-width="1080"
      data-height="1920"
    >
      <div id="card" class="clip" data-start="0" data-duration="4" data-track-index="0">
        <div id="bar"></div>
        <h1 id="title" data-var-text="title">Your Video Title</h1>
        <p id="subtitle" data-var-text="subtitle">A short subtitle</p>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#bar", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, 0.1);
      tl.fromTo("#title", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.7, ease: "power4.out" }, 0.25);
      tl.fromTo("#subtitle", { opacity: 0, y: 30 }, { opacity: 0.7, y: 0, duration: 0.6, ease: "power3.out" }, 0.5);
      tl.to(["#bar", "#title", "#subtitle"], { opacity: 0, duration: 0.4, ease: "power2.in" }, 3.5);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
